name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debug files
        run: |
          echo "Project structure:"
          ls -R

      - name: Validate project structure
        run: |
          echo "Checking required files..."
          test -f nodeapp/frontend/index.html
          test -f nodeapp/frontend/style.css
          echo "All required files exist ✔"

      - name: Lint HTML (basic)
        run: |
          echo "Basic HTML check"
          grep -q "<html" nodeapp/frontend/index.html

      - name: Build step
        run: |
          echo "Building project..."
          rm -rf docs
          mkdir docs
          cp -r nodeapp/frontend/* docs/
          echo "Build complete ✔"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs