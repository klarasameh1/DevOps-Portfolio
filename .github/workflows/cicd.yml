name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ CI: Validate files
      - name: Validate project structure
        run: |
          echo "Checking required files..."
          test -f nodeapp/frontend/index.html
          test -f nodeapp/frontend/style.css
          echo "All required files exist ✔"

      # 3️⃣ CI: Lint (basic check)
      - name: Lint HTML (basic)
        run: |
          echo "Basic HTML check"
          grep -q "<html" src/index.html

      # 4️⃣ CI: Simulate build step
      - name: Build step
        run: |
          echo "Building project..."
          rm -rf docs
          mkdir docs
          cp nodeapp/frontend/* docs/
          echo "Build complete ✔"

      # 5️⃣ CD: Deploy
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs